name: Build Windows game

on:
  push:
    tags:
      - 'stage-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Game logic tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package Windows program
        run: npx electron-builder --win portable --x64 --publish never

      - name: Keep the program as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: StreetwearTycoon-windows
          path: release/StreetwearTycoon.exe
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Streetwear Tycoon ${{ github.ref_name }}
          files: release/StreetwearTycoon.exe
          body: |
            Download **StreetwearTycoon.exe** below and double-click it to play.
            Windows may say "Windows protected your PC": click **More info**, then **Run anyway**.
